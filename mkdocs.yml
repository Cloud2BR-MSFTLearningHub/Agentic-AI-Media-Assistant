site_name: Zava Media AI Assistant
site_description: Reference architecture and deployment guidance for a multimodal AI media assistant.
site_url: https://cloud2br-msftlearninghub.github.io/Agentic-AI-Media-Assistant/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/Agentic-AI-Media-Assistant
repo_name: Cloud2BR-MSFTLearningHub/Agentic-AI-Media-Assistant
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>

theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub

nav:
  - Home: index.md
  - Deployment:
      - Terraform template: deployment/terraform.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md