name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/deploy-pages.yml
      - site-assets/pages.css
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Build site
        run: |
          mkdir -p _site
          pandoc README.md --from gfm --to html5 --standalone --metadata title="Zava Media AI Assistant" --css pages.css --output _site/index.html
          cp site-assets/pages.css _site/pages.css
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4